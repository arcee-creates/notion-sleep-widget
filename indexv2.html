<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Sleep Tracker</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f7f6f3;
      --text: #37352f;
      --accent: #6366f1;
      --target: #ef4444;
      --border: #e9e9e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #191919;
        --card-bg: #202020;
        --text: #d4d4d4;
        --accent: #818cf8;
        --target: #f87171;
        --border: #2f2f2f;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    input[type="date"], input[type="number"] {
      flex: 1;
      min-width: 120px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 220px;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .empty-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      width: 100%;
    }

    .log-list {
      margin-top: 16px;
      max-height: 120px;
      overflow-y: auto;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      padding: 4px 0;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--target);
      cursor: pointer;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌙 Sleep Tracker Trend</h2>

    <div class="form-group">
      <input type="date" id="sleepDate">
      <input type="number" id="sleepHours" step="0.1" min="0" max="24" placeholder="Hours (e.g. 7.5)">
      <button onclick="addEntry()">Add Entry</button>
      <button onclick="clearData()" style="background:transparent; color:#888;">Clear All</button>
    </div>

    <div class="chart-box">
      <div id="emptyMsg" class="empty-msg">No sleep data yet. Log your first entry above!</div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="log-list" id="logList"></div>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('notion_sleep_clean')) || [];
    const target = 8.0;

    document.getElementById('sleepDate').valueAsDate = new Date();

    function addEntry() {
      const d = document.getElementById('sleepDate').value;
      const h = parseFloat(document.getElementById('sleepHours').value);

      if (!d || isNaN(h)) {
        alert('Please select a date and enter sleep hours.');
        return;
      }

      const formatted = new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
      logs.push({ date: formatted, hours: h, raw: d });
      logs.sort((a, b) => new Date(a.raw) - new Date(b.raw));

      document.getElementById('sleepHours').value = '';
      update();
    }

    function removeEntry(i) {
      logs.splice(i, 1);
      update();
    }

    function clearData() {
      if (confirm('Clear all sleep entries?')) {
        logs = [];
        update();
      }
    }

    function update() {
      localStorage.setItem('notion_sleep_clean', JSON.stringify(logs));
      
      const emptyMsg = document.getElementById('emptyMsg');
      emptyMsg.style.display = logs.length === 0 ? 'block' : 'none';

      drawChart();
      renderLogs();
    }

    function drawChart() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // Set canvas render resolution
      canvas.width = canvas.offsetWidth * 2;
      canvas.height = canvas.offsetHeight * 2;
      ctx.scale(2, 2);

      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      const pad = 30;

      ctx.clearRect(0, 0, w, h);

      if (logs.length === 0) return;

      const maxH = 12;
      const getY = (val) => h - pad - ((val / maxH) * (h - pad * 2));
      const getX = (idx) => logs.length === 1 ? w / 2 : pad + (idx * ((w - pad * 2) / (logs.length - 1)));

      // Target Line
      ctx.beginPath();
      ctx.strokeStyle = '#ef4444';
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.5;
      ctx.moveTo(pad, getY(target));
      ctx.lineTo(w - pad, getY(target));
      ctx.stroke();
      ctx.setLineDash([]);

      // Data Line
      ctx.beginPath();
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2.5;

      logs.forEach((item, i) => {
        const x = getX(i);
        const y = getY(item.hours);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // Points & Labels
      logs.forEach((item, i) => {
        const x = getX(i);
        const y = getY(item.hours);

        ctx.beginPath();
        ctx.fillStyle = '#6366f1';
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#888';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(item.date, x, h - 8);
        ctx.fillText(item.hours + 'h', x, y - 8);
      });
    }

    function renderLogs() {
      const el = document.getElementById('logList');
      el.innerHTML = '';
      logs.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <span><strong>${item.date}:</strong> ${item.hours} hrs</span>
          <button class="del-btn" onclick="removeEntry(${i})">Remove</button>
        `;
        el.appendChild(div);
      });
    }

    window.addEventListener('resize', drawChart);
    update();
  </script>
</body>
</html>
