<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Sleep Tracker Widget</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #ffffff;
      --card-bg: #f7f6f3;
      --text-color: #37352f;
      --accent-color: #6366f1;
      --target-color: #ef4444;
      --border-color: #e9e9e7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #191919;
        --card-bg: #202020;
        --text-color: #d4d4d4;
        --accent-color: #818cf8;
        --target-color: #f87171;
        --border-color: #2f2f2f;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, button {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 0.85rem;
    }

    input[type="date"], input[type="number"] {
      flex: 1;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .chart-container {
      position: relative;
      height: 240px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>🌙 Sleep Tracker Trend</h2>
    </div>

    <!-- Entry Form -->
    <div class="form-group">
      <input type="date" id="sleepDate">
      <input type="number" id="sleepHours" step="0.1" min="0" max="24" placeholder="Hours (e.g., 7.5)">
      <button onclick="addEntry()">Add Entry</button>
      <button onclick="clearData()" style="background-color: transparent; color: #888; border: 1px solid var(--border-color);">Reset</button>
    </div>

    <!-- Chart Canvas -->
    <div class="chart-container">
      <canvas id="sleepChart"></canvas>
    </div>
  </div>

  <script>
    // Initial Sample Data if none exists
    const defaultData = [
      { date: 'Mon', hours: 6.5 },
      { date: 'Tue', hours: 7.2 },
      { date: 'Wed', hours: 8.0 },
      { date: 'Thu', hours: 5.8 },
      { date: 'Fri', hours: 7.5 },
      { date: 'Sat', hours: 8.5 },
      { date: 'Sun', hours: 7.0 }
    ];

    // Load from localStorage or default
    let sleepLogs = JSON.parse(localStorage.getItem('notion_sleep_logs')) || defaultData;
    const targetHours = 8.0;

    // Initialize Input Date to Today
    document.getElementById('sleepDate').valueAsDate = new Date();

    // Setup Chart.js
    const ctx = document.getElementById('sleepChart').getContext('2d');
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: sleepLogs.map(item => item.date),
        datasets: [
          {
            label: 'Hours Slept',
            data: sleepLogs.map(item => item.hours),
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            fill: true,
            tension: 0.3,
            borderWidth: 2,
            pointRadius: 4
          },
          {
            label: 'Target (8h)',
            data: Array(sleepLogs.length).fill(targetHours),
            borderColor: '#ef4444',
            borderDash: [5, 5],
            borderWidth: 1.5,
            pointRadius: 0,
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            min: 0,
            max: 12,
            grid: { color: 'rgba(150, 150, 150, 0.1)' }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });

    // Add New Entry Function
    function addEntry() {
      const dateVal = document.getElementById('sleepDate').value;
      const hoursVal = parseFloat(document.getElementById('sleepHours').value);

      if (!dateVal || isNaN(hoursVal)) {
        alert('Please fill out both the date and sleep hours.');
        return;
      }

      // Format date short string (e.g. "Oct 12")
      const formattedDate = new Date(dateVal).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });

      sleepLogs.push({ date: formattedDate, hours: hoursVal });
      
      // Keep last 14 entries for clean display
      if (sleepLogs.length > 14) sleepLogs.shift();

      saveAndUpdate();
      document.getElementById('sleepHours').value = '';
    }

    function clearData() {
      if (confirm("Reset sleep data to default sample?")) {
        sleepLogs = defaultData;
        saveAndUpdate();
      }
    }

    function saveAndUpdate() {
      localStorage.setItem('notion_sleep_logs', JSON.stringify(sleepLogs));
      chart.data.labels = sleepLogs.map(item => item.date);
      chart.data.datasets[0].data = sleepLogs.map(item => item.hours);
      chart.data.datasets[1].data = Array(sleepLogs.length).fill(targetHours);
      chart.update();
    }
  </script>
</body>
</html>
